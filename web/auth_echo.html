<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GLOW: тестовое окно</title>
<!-- The window that test 4 of web/auth_test.html opens: it tells the page that opened it whether it still has a way back
	(opener, shared storage, broadcast). Nothing else; no data leaves the browser. -->
<style>
	body { margin: 0; padding: 24px; font: 18px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; background: #F4EEFF; color: #2B2345; }
	h2 { margin: 0 0 12px; font-size: 22px; }
</style>
</head>
<body>
<h2>Тестовое окно</h2>
<p id="s">Отправляю сообщение странице, которая меня открыла…</p>
<p>Прочитайте строку выше, закройте это окно (кнопка «Готово» или «Закрыть») и вернитесь на страницу проверки.</p>
<script>
(function () {
	"use strict";
	var info = { opener: false, standalone: navigator.standalone === true, t: Date.now() };
	try { info.opener = !!window.opener; } catch (e) { /* none */ }
	var sent = [];
	try { if (window.opener) { window.opener.postMessage({ glowEcho: info }, location.origin); sent.push("postMessage"); } } catch (e) { sent.push("postMessage: ошибка"); }
	try { localStorage.setItem("glow_echo", JSON.stringify(info)); sent.push("общее хранилище"); } catch (e) { /* none */ }
	try { var bc = new BroadcastChannel("glow_echo"); bc.postMessage(info); sent.push("BroadcastChannel"); } catch (e) { /* none */ }
	document.getElementById("s").textContent = "Связь с открывшей меня страницей (opener): " + (info.opener ? "ЕСТЬ" : "НЕТ") +
		". Сообщения отправлены через: " + (sent.join(", ") || "ничего") + ".";
})();
</script>
</body>
</html>
