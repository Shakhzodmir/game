<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>404 · GLOW</title>
<style>
	* { box-sizing: border-box; }
	html, body { min-height: 100%; margin: 0; }
	body {
		display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
		padding: 28px 20px 20px; text-align: center; color: #3A2470;
		background: linear-gradient(180deg, #FFF8EC 0%, #F1EBFF 100%);
		font: 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
	}
	main { width: 100%; max-width: 460px; }

	/* Bit, drawn with CSS only: a round furry face in big headphones */
	.bit { position: relative; width: 180px; height: 170px; margin: 0 auto 10px; animation: bob 3s ease-in-out infinite; }
	.band { position: absolute; left: 16px; top: 0; width: 148px; height: 84px; border: 14px solid #7B4FFF; border-bottom: 0; border-radius: 84px 84px 0 0; }
	.face { position: absolute; left: 24px; top: 28px; width: 132px; height: 132px; border-radius: 50%; background: #FFC98B; border: 4px solid #E0873A; }
	.cup { position: absolute; top: 62px; width: 34px; height: 58px; border-radius: 17px; background: #FF4D8D; border: 5px solid #7B4FFF; }
	.cup.l { left: 4px; }
	.cup.r { right: 4px; }
	.light { position: absolute; top: 80px; width: 8px; height: 8px; border-radius: 50%; background: #FFE066; }
	.light.l { left: 17px; }
	.light.r { right: 17px; }
	.eye { position: absolute; top: 48px; width: 15px; height: 19px; border-radius: 50%; background: #3A2470; }
	.eye::after { content: ""; position: absolute; left: 3px; top: 3px; width: 5px; height: 5px; border-radius: 50%; background: #fff; }
	.eye.l { left: 34px; }
	.eye.r { right: 34px; }
	.cheek { position: absolute; top: 74px; width: 20px; height: 12px; border-radius: 50%; background: #FF9DB5; opacity: .85; }
	.cheek.l { left: 16px; }
	.cheek.r { right: 16px; }
	.mouth { position: absolute; left: 50%; top: 82px; width: 14px; height: 17px; margin-left: -7px; border-radius: 50%; background: #B23A5E; }
	@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
	@media (prefers-reduced-motion: reduce) { .bit { animation: none; } }

	.code { font-size: 64px; line-height: 1; font-weight: 900; letter-spacing: .06em; color: #6C4BD1; margin: 6px 0 2px; }
	h1 { font-size: 24px; line-height: 1.3; margin: 6px 0 8px; }
	p { margin: 6px 0 20px; color: #5a4890; }
	.go {
		display: inline-block; min-width: 220px; padding: 14px 26px; font-size: 19px; font-weight: 800; text-decoration: none;
		color: #fff; background: #6C4BD1; border-radius: 18px; box-shadow: 0 5px 0 #4D32A0;
	}
	.go:active { transform: translateY(3px); box-shadow: 0 2px 0 #4D32A0; }
	.go:focus-visible, .langs button:focus-visible { outline: 3px solid #FFB84D; outline-offset: 3px; }

	.js [data-l] { display: none; }
	html[data-lang="ru"] [data-l="ru"], html[data-lang="en"] [data-l="en"], html[data-lang="ko"] [data-l="ko"] { display: block; }
	html:not(.js) [data-l] + [data-l] { margin-top: 18px; }

	.langs { display: none; gap: 8px; margin-top: 30px; justify-content: center; }
	.js .langs { display: flex; }
	.langs button {
		font: inherit; font-size: 15px; font-weight: 700; min-width: 54px; padding: 8px 14px; cursor: pointer;
		color: #6C4BD1; background: #fff; border: 2px solid #E3D9FF; border-radius: 12px;
	}
	.langs button[aria-pressed="true"] { color: #fff; background: #6C4BD1; border-color: #6C4BD1; }
</style>
</head>
<body>
<main>
	<div class="bit" aria-hidden="true">
		<div class="band"></div>
		<div class="face">
			<div class="eye l"></div><div class="eye r"></div>
			<div class="cheek l"></div><div class="cheek r"></div>
			<div class="mouth"></div>
		</div>
		<div class="cup l"></div><div class="cup r"></div>
		<div class="light l"></div><div class="light r"></div>
	</div>
	<div class="code">404</div>

	<div data-l="ru" lang="ru">
		<h1>Ой, такой страницы нет</h1>
		<p>Бит искал везде, но здесь тихо. Вернёмся к музыке?</p>
		<a class="go" href="/game/">Вернуться в игру</a>
	</div>
	<div data-l="en" lang="en">
		<h1>Oops, there is no such page</h1>
		<p>Bit looked everywhere, but it is quiet here. Shall we get back to the music?</p>
		<a class="go" href="/game/">Back to the game</a>
	</div>
	<div data-l="ko" lang="ko">
		<h1>앗, 이런 페이지는 없어요</h1>
		<p>비트가 여기저기 찾아봤는데 이곳은 조용해요. 음악으로 돌아갈까요?</p>
		<a class="go" href="/game/">게임으로 돌아가기</a>
	</div>

	<div class="langs" role="group" aria-label="Language">
		<button type="button" data-set="ru" aria-pressed="false">RU</button>
		<button type="button" data-set="en" aria-pressed="false">EN</button>
		<button type="button" data-set="ko" aria-pressed="false">KO</button>
	</div>
</main>

<script>
(function () {
	var d = document.documentElement, L = ["ru", "en", "ko"];
	var buttons = document.querySelectorAll(".langs button");
	function pick() {
		var n = ((navigator.language || "en") + "").slice(0, 2).toLowerCase();
		return L.indexOf(n) >= 0 ? n : "en";
	}
	function show(l) {
		d.setAttribute("data-lang", l);
		d.lang = l;
		for (var i = 0; i < buttons.length; i++) {
			buttons[i].setAttribute("aria-pressed", buttons[i].getAttribute("data-set") === l ? "true" : "false");
		}
	}
	d.className = "js";
	for (var i = 0; i < buttons.length; i++) {
		buttons[i].addEventListener("click", function () { show(this.getAttribute("data-set")); });
	}
	show(pick());
})();
</script>
</body>
</html>
